name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow running CI manually from the Actions tab (e.g. to re-gate a deploy
  # without pushing a new commit).
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --workspace=backend
      - name: Node syntax check
        run: |
          node --check backend/src/index.js
          node --check backend/src/services/stockService.js
          node --check backend/src/routes/stocks.js
          node --check backend/src/engines/riskScoreEngine.js
          node --check backend/src/engines/expectationEngine.js

  frontend:
    name: Frontend — type-check, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --workspace=frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
