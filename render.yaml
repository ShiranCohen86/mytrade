services:
  # ── Full-stack web app: Express serves API + Vite SPA ─────────────────────
  - type: web
    name: mytrade
    env: node
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: node backend/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false           # Set in Render dashboard → Environment
      - key: CACHE_TTL_MINUTES
        value: 60
      - key: CRON_SCHEDULE
        value: "0 */2 * * *"
      - key: NEWS_API_KEY
        sync: false           # Optional — falls back to Google News RSS
      - key: NEWS_PROVIDER
        value: newsapi        # newsapi | googlerss
