name: Deploy to Render

# Deploys to Render after the CI workflow passes on `main`.
# Setup (one-time):
#   1. Render dashboard → your service → Settings → Deploy Hook → copy the URL.
#   2. GitHub repo → Settings → Secrets and variables → Actions → New secret:
#        Name:  RENDER_DEPLOY_HOOK_URL
#        Value: <the deploy hook URL, e.g. https://api.render.com/deploy/srv-xxxx?key=yyyy>
#   3. In render.yaml set `autoDeploy: false` so Render doesn't also deploy on
#      its own (otherwise every push triggers two deploys).

on:
  # Run only after the "CI" workflow finishes — so we never deploy a broken build.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Allow a manual deploy from the Actions tab too.
  workflow_dispatch:

# Never run two deploys at once; cancel an in-flight one if a newer push lands.
concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    # For workflow_run: only deploy when CI actually succeeded.
    # For workflow_dispatch: the event has no workflow_run, so allow it through.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Call Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Triggering Render deploy…"
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$HOOK_URL")
          echo "HTTP $status"
          cat response.txt
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $status"
            exit 1
          fi
          echo "✅ Deploy triggered. Track progress in the Render dashboard."
