services:
  # ── Full-stack web app: Express serves API + Vite SPA ─────────────────────
  - type: web
    name: mytrade
    env: node
    region: oregon
    plan: free
    branch: main
    # Deploys are triggered by the GitHub Actions workflow (.github/workflows/deploy.yml)
    # via the Render deploy hook, after CI passes. Disabled here to avoid double deploys.
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: node backend/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin a known-good Node (the build uses vite-plugin-pwa's SW build).
      - key: NODE_VERSION
        value: "22"

      # ── Database ──────────────────────────────────────────────────────────
      - key: MONGO_URI
        sync: false           # Set in Render dashboard → Environment

      # ── Authentication (JWT) ─────────────────────────────────────────────
      # Generate: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false           # Set in Render dashboard → Environment
      - key: JWT_REFRESH_SECRET
        sync: false           # Set in Render dashboard → Environment

      # ── Frontend URL (used for password reset links + Google OAuth redirect)
      # Set this to your Render service URL: https://mytrade-zty9.onrender.com
      - key: CLIENT_URL
        sync: false           # Set in Render dashboard → Environment

      # ── Google OAuth (optional) ────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false           # Set in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false           # Set in Render dashboard
      - key: GOOGLE_CALLBACK_URL
        value: https://mytrade-zty9.onrender.com/auth/google/callback

      # ── Web Push (VAPID) ──────────────────────────────────────────────────
      # Generate the pair: node -e "console.log(require('web-push').generateVAPIDKeys())"
      # Public key + subject are not secret (the public key ships to browsers).
      - key: VAPID_PUBLIC_KEY
        value: BCr5Fu835XvP0L_-luj_PoYKm8sj7cH6lOBt7dcxaRH3X3ejtAtszzxyMMWHsy3F4BdEDx5NCQ9cr3Nf2ntfCmo
      - key: VAPID_SUBJECT
        value: mailto:shiranc86@gmail.com
      - key: VAPID_PRIVATE_KEY
        sync: false           # Secret — set in Render dashboard → Environment

      # ── Observability & Scale (optional — features are env-gated) ─────────
      # Error tracking. Unset = disabled (no-op). Set to a Sentry DSN to enable.
      - key: SENTRY_DSN
        sync: false           # Optional — set in Render dashboard to enable Sentry
      # Horizontal scaling for realtime sockets. Unset = single-instance (current).
      # Set to a Redis connection URL to fan socket.io events across instances.
      - key: REDIS_URL
        sync: false           # Optional — set when running >1 instance

      # ── News & Cache ──────────────────────────────────────────────────────
      - key: CACHE_TTL_MINUTES
        value: 60
      - key: CRON_SCHEDULE
        value: "0 */2 * * *"
      - key: NEWS_API_KEY
        sync: false           # Optional — falls back to Google News RSS
      - key: NEWS_PROVIDER
        value: newsapi        # newsapi | googlerss
